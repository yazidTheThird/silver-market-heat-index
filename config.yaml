# Methodology 2: the old composite and its thresholds are retained for historical
# interpretation only. They do not drive a buying verdict or mintage advice.
evidence:
  min_cohort: 30       # operational minimum per matched seven-day cohort
  min_stores: 3
  min_sales_units: 30  # per completed-sales period; not a statistical confidence level

# Market Heat Index — settings (colorized collectibles edition)
# Weights don't need to add to 100; they are rescaled automatically, and any
# source that fails on a given day is dropped and the rest are rescaled.

weights:
  drops: 35         # how fast colorized launches are selling out at mints/dealers
  ebay: 30          # what collectors pay for colorized vs the same plain coin
  attention: 15     # Reddit + Google Trends chatter about colorized coins
  silver: 10        # silver price mood (background only)
  calendar: 10      # paydays, season, weekday, crowded release weeks

thresholds:
  hot: 70           # >= this: launch, consider bigger mintage
  dead: 40          # <  this: hold, or pre-orders only

# How many days of history a signal needs before it is scored against its own past.
min_history_days: 14
# If sources covering less than this share of the total weight answered today,
# the dashboard shows "LOW DATA" instead of a HOT/NORMAL/DEAD verdict.
min_coverage: 0.5
lookback_days: 90

# What the tracker follows. "collectible" (default) = every collectible / limited
# release, with colorized ones flagged; plain bullion (random-year coins, generic
# rounds and bars, tubes, junk silver) is skipped. "colorized" = colorized only.
# The heat index itself is always computed from the colorized products.
tracking:
  mode: collectible
  # exclude_pattern: "goldback|banknote"     # anything else you never want tracked

# Rough exchange rates for stores that don't price in USD (used for price bands and
# premium over spot only). Update now and then.
fx_to_usd: {AUD: 0.65, CAD: 0.72, GBP: 1.30, EUR: 1.10, NZD: 0.59}

# What counts as a colorized product (checked against titles, types and tags).
colorized_pattern: "coloriz|colouriz|colorised|colourised|colou?red\\b|full[- ]colou?r|\\bcolou?r in\\b|chromatic|enamel"

# ---------------------------------------------------------------- 1. drops
# Stores that sell colorized coins — works on any platform.
#
# For each store give the home URL plus at least ONE of:
#   listing_urls: the page(s) that list their colorized products (or all new
#                 releases). Best option. Copy them from your browser's address bar.
#   sitemap_url:  the store's sitemap (often <store>/sitemap.xml) — used to find
#                 product pages if the listing pages don't work.
# Shopify and WooCommerce stores are detected automatically and need neither.
#
# Optional per store:
#   listing_is_colorized: true   every product on the listing page is colorized
#                                (skips the name check — use for "Colorized" categories)
#   listing_is_collectible: true every product on the listing page is a collectible
#                                release (only plain bullion gets skipped)
#   currency: AUD                prices on this store aren't in USD (see fx_to_usd)
#   page_param: "page"           pagination parameter if the listing has several pages
#   max_pages: 3
#   product_link_pattern: "/product/"   regex matching product URLs, if the default
#                                       guess picks up the wrong links
#   render: true                 the store only shows products after JavaScript runs
#                                (slower — uses a headless browser)
#   platform: generic            force a method: auto | shopify | woocommerce | generic
drops:
  stores:
    # ---- Small shops with their own colorized/exclusive drops (closest to CCB) ----
    - url: "https://www.coinstv.net"            # Shopify ("Chromatics" line)
      platform: shopify
    - url: "https://www.herobullion.com"        # WooCommerce
      platform: woocommerce
    - url: "https://grreserve.com"              # WooCommerce
      platform: woocommerce
    - url: "https://bullionsharks.com"          # limited-edition colorized Eagles/Libertads
      platform: generic
      sitemap_url: "https://bullionsharks.com/xmlsitemap.php"
      listing_urls: ["https://bullionsharks.com/"]
      product_link_pattern: "coloriz|colouriz|chromatic"
    - url: "https://popcoins.store"             # micro-mintage colorized coins (auto-detect)

    # ---- Collector shops (Shopify: whole catalog read from the feed, no setup) ----
    - url: "https://www.mycollectables.com.au"  # Australia — huge world-coin catalog
      platform: shopify
      currency: AUD
    - url: "https://www.directcoins.com.au"     # Australia — Perth/RAM/new releases
      currency: AUD
    - url: "https://cdncoin.com"                # Canada — Royal Canadian Mint releases
      currency: CAD

    # ---- Big dealers: colorized + new-release / limited-edition categories ----
    - url: "https://www.apmex.com"
      platform: generic
      listing_urls:
        - "https://www.apmex.com/category/25063/apmex-colorized-rounds"
        - "https://www.apmex.com/category/80072/new-releases"
      listing_is_collectible: true
      product_link_pattern: "/product/\\d+/"
    - url: "https://sdbullion.com"
      platform: generic
      listing_urls:
        - "https://sdbullion.com/buy/colorized-1-oz-silver-coins"
        - "https://sdbullion.com/buy/colorized-lunar-new-year-coins"
        - "https://sdbullion.com/buy/colorized-zodiac-animal-coins"
        - "https://sdbullion.com/buy/limited-edition-silver-coins"
      listing_is_collectible: true
      product_link_pattern: "(silver|gold|copper).*(coin|round|bar)"
    - url: "https://bullionexchanges.com"       # products load via JavaScript
      platform: generic
      render: true
      listing_urls: ["https://bullionexchanges.com/buy-silver/coins/colorized-silver-coins"]
      listing_is_colorized: true
      product_link_pattern: "coloriz|colouriz"
    - url: "https://www.providentmetals.com"
      platform: generic
      listing_urls: ["https://www.providentmetals.com/2026-new-releases.html"]
      listing_is_collectible: true
      product_link_pattern: "^/\\d{4}-.+\\.html$"
    - url: "https://www.moneymetals.com"
      platform: generic
      listing_urls:
        - "https://www.moneymetals.com/buy/silver/colorized"
        - "https://www.moneymetals.com/buy/silver/coins/collectible-silver-coins"
      listing_is_collectible: true
      product_link_pattern: "/[a-z0-9-]+/\\d{3,6}$"
    - url: "https://www.bullionbypost.co.uk"    # UK — 2026 silver coins
      platform: generic
      currency: GBP
      listing_urls: ["https://www.bullionbypost.co.uk/silver-coins/2026-silver-coins/"]
      listing_is_collectible: true
      product_link_pattern: "/silver-coins/[^/]+/[^/]+/?$"

    # ---- Added 11 Nov 2026 after a reachability test from GitHub's servers ----
    # Public product feeds (whole catalogue read cheaply, every run)
    - url: "https://www.moderncoinmart.com"     # big US collector dealer, has a Presale category
      platform: woocommerce
    - url: "https://www.pinehurstcoins.com"     # US graded/new releases, "Silver Presale" category
      platform: woocommerce
    - url: "https://www.intagliomint.com"       # private mint (US)
      platform: woocommerce
    - url: "https://www.libertycoin.com"        # US
      platform: woocommerce
    - url: "https://www.goldsilver.com"         # US
      platform: woocommerce
    - url: "https://www.libertymint.com"        # US private mint
      platform: woocommerce
    - url: "https://www.summitmetals.com"       # US (mostly bullion; plain bullion is skipped)
      platform: shopify
    - url: "https://www.highlandmint.com"       # US private mint
      platform: shopify
    - url: "https://www.numiscollect.eu"        # EU collector coins
      platform: woocommerce
      currency: EUR
    - url: "https://www.downies.com"            # Australia
      platform: shopify
      currency: AUD
    - url: "https://www.melbournecoins.com.au"  # Australia
      platform: shopify
      currency: AUD
    - url: "https://www.goldstackers.com.au"    # Australia
      platform: woocommerce
      currency: AUD
    - url: "https://www.nzmint.com"             # New Zealand Mint
      platform: shopify
      currency: NZD
    - url: "https://www.bullionmart.ca"         # Canada
      platform: woocommerce
      currency: CAD

    # Read page by page from the sitemap, newest first (slower; the first ~10 days
    # are spent working through old catalogue, which the gallery leaves out)
    - url: "https://www.goldenstatemint.com"    # US private mint (copper/silver rounds)
      platform: generic
      sitemap_url: "https://www.goldenstatemint.com/sitemap.xml"
      sitemap_max_age_days: 365
      product_link_pattern: "\\.html$"
    - url: "https://www.mintstategold.com"      # US
      platform: generic
      sitemap_url: "https://www.mintstategold.com/sitemap.xml"
      sitemap_max_age_days: 180
      product_link_pattern: "-\\d{3,6}\\.html$"
    - url: "https://www.texmetals.com"          # US (Texas Precious Metals)
      platform: generic
      sitemap_url: "https://www.texmetals.com/sitemap.xml"
      sitemap_max_age_days: 365
      product_link_pattern: "^/p/"
    - url: "https://www.boldpreciousmetals.com" # US
      platform: generic
      sitemap_url: "https://www.boldpreciousmetals.com/sitemap.xml"
      sitemap_child_pattern: "/products\\.xml"
      sitemap_max_age_days: 365
      product_link_pattern: "^/product/\\d+/"
    - url: "https://www.govmint.com"            # US
      platform: generic
      sitemap_url: "https://www.govmint.com/sitemap.xml"
      sitemap_child_pattern: "sitemap-\\d"
      sitemap_max_age_days: 180
      product_link_pattern: "^/[a-z0-9]+(?:-[a-z0-9]+){3,}$"
    - url: "https://www.perthmint.com"          # Perth Mint (Australia)
      platform: generic
      currency: AUD
      sitemap_url: "https://www.perthmint.com/sitemap.xml"
      sitemap_max_age_days: 365
      product_link_pattern: "^/shop/(?!jewellery|gifts)[^/]+/.+/"
    - url: "https://www.thecoinshop.com.au"     # Australia
      platform: generic
      currency: AUD
      sitemap_url: "https://www.thecoinshop.com.au/sitemap.xml"
      product_link_pattern: "^/product/"
    - url: "https://www.royalmint.com"          # Royal Mint (UK)
      platform: generic
      currency: GBP
      sitemap_url: "https://www.royalmint.com/sitemap.xml"
      sitemap_child_pattern: "bundle=commerce"
      sitemap_max_age_days: 365
      product_link_pattern: "^/[a-z-]+/[^/]+/.+"
    - url: "https://www.chards.co.uk"           # UK
      platform: generic
      currency: GBP
      sitemap_url: "https://www.chards.co.uk/sitemap.xml"
      sitemap_child_pattern: "/products\\.xml"
      sitemap_max_age_days: 180
      product_link_pattern: "/\\d{3,6}/?$"
    - url: "https://www.mdm.de"                 # Germany (MDM)
      platform: generic
      currency: EUR
      sitemap_url: "https://www.mdm.de/sitemap-product.xml"
      sitemap_child_pattern: "sitemap-product"
      sitemap_max_age_days: 180
      product_link_pattern: "^/[a-z0-9-]{12,}$"
    - url: "https://www.emk.com"                # Germany (Emporium Hamburg)
      platform: generic
      currency: EUR
      sitemap_url: "https://www.emk.com/sitemap.xml"
      sitemap_child_pattern: "sitemap_"
      sitemap_max_age_days: 180
      product_link_pattern: "^/en-us/.+/[^/]+-\\d+$|^/en-us/.+/[^/]{25,}$"

    # Removed after the first runs:
    #   JM Bullion, BGASC, Silver.com — block automated visitors (HTTP 401)
    #   Littleton — product pages don't show stock status
    #   Scottsdale Mint — page times out even in a headless browser
    # Tested 11 Nov 2026 and left out (block automated visitors, or no readable
    # stock on product pages): BGASC, JM Bullion, Silver.com, BullionMax, Money
    # Metals, BullionByPost, SilverGoldBull, Monument Metals, Golden Eagle Coins,
    # US Mint, Royal Canadian Mint, Royal Australian Mint, Germania Mint, CIT,
    # Pobjoy, Powercoin, Westminster, SilverTowne, Littleton, Coinworks
  fast_window_days: 7             # fast checker re-checks launches from the last 7 days
  fast_max_checks_per_store: 40   # page fetches per store per fast check (non-feed stores)
  recent_days: 30                 # "recent launches" = launched in the last 30 days
  fast_sellout_days: 2            # a sell-out within 2 days counts as "fast"
  max_product_checks_per_store: 150
  feed_max_pages: 20              # Shopify feed pages per store (250 products each)
  recheck_soldout_days: 7         # sold-out items are re-checked weekly for restocks

# ----------------------------------------------------------------- 2. eBay
# Each pair compares colorized listings with the same coin in plain form.
# The ratio between them is the "collector premium" — silver price cancels out.
ebay:
  pairs:
    - colorized: "colorized silver libertad 1 oz"
      plain: "silver libertad 1 oz"
    - colorized: "colorized silver eagle 1 oz"
      plain: "american silver eagle 1 oz"
    - colorized: "colorized half dollar"
      plain: "half dollar silver"
    - colorized: "colorized 1 oz silver round"
      plain: "1 oz silver round"
  category_id: "11116"     # Coins & Paper Money
  max_items_per_query: 200

# ------------------------------------------------------------ 3. attention
attention:
  subreddits: ["Silverbugs", "Pmsforsale", "coins", "Coins4Sale"]
  reddit_query: "colorized OR colourized OR colorised OR colourised"
  trends_keywords: ["colorized coin", "colorized silver"]
  trends_geo: "US"

# --------------------------------------------------------------- 4. silver
silver:
  ticker: "SI=F"           # COMEX silver futures on Yahoo Finance

# ------------------------------------------------------------- 5. calendar
calendar:
  # month -> seasonal demand score (0-100)
  season: {1: 45, 2: 50, 3: 55, 4: 55, 5: 50, 6: 45, 7: 45, 8: 50, 9: 55, 10: 65, 11: 85, 12: 90}
  # weekday (0=Mon) -> score
  weekday: {0: 50, 1: 55, 2: 55, 3: 60, 4: 70, 5: 75, 6: 70}
  competing_window_days: 3   # drops you log within +/- this many days count
  competing_penalty: 15      # points removed per competing drop

# ---------------------------------------------------------------- What's hot
# Ranks themes, base coins and sizes by how fast they sell out (dashboard section,
# data/hot_groups.csv, and a weekly Telegram digest). Tagging rules are in
# mhi/tags.py; to change them, copy a block from there into `tags:` below.
hot_groups:
  metals: ["Silver"]      # keep it silver for now; add "Copper" / "Gold" later
  window_days: 90         # launches from the last 90 days count
  min_launches: 3         # fewer launches than this = "low confidence" in that group
  mature_days: 7          # a launch counts toward "share sold out" after 7 days on sale
  fast_hours: 48          # a sell-out within 48 h counts as fast
  digest_weekday: 0       # weekly digest in the Telegram message: 0 = Monday

# ------------------------------------------------------- New releases gallery
# docs/releases.html: every new listing at the stores above as pictures, newest
# first. Rebuilt on every run (daily and the 3-hourly check). Any store you add
# to `drops.stores` shows up there too. These are the defaults; change if needed.
gallery:
  window_days: 90        # how far back the page goes
  bulk_first_seen: 25    # for stores that give no release date: this many "new"
                         # products at one store in one day is the tracker finding
                         # old catalogue, not a launch day, so they are left off

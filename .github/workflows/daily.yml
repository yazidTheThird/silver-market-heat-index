name: Daily Market Heat Index

on:
  schedule:
    - cron: "47 6 * * *"     # main run: 06:47 UTC (06:47 Morocco time)
    - cron: "17 9 * * *"     # backup: 09:17 UTC — only runs if the morning run was skipped
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's index already exists (backup run only)
        id: check
        run: |
          today=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "^${today}," data/history.csv 2>/dev/null; then
            echo "Today's index already exists — skipping backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Install headless browser (only if a store uses render true)
        if: steps.check.outputs.skip != 'true'
        run: |
          if grep -Eq '^\s*render:\s*true' config.yaml; then
            python -m playwright install --with-deps chromium
          fi

      - name: Compute index
        if: steps.check.outputs.skip != 'true'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python run.py

      - name: Save history and dashboard
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "market-heat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Index update $(date -u +%F)"
          git pull --rebase -q || true
          git push

name: Daily Market Heat Index

on:
  schedule:
    - cron: "47 6 * * *"     # every day 06:47 UTC (06:47 Morocco time)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install headless browser (only if a store uses render true)
        run: |
          if grep -Eq '^\s*render:\s*true' config.yaml; then
            python -m playwright install --with-deps chromium
          fi

      - name: Compute index
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python run.py

      - name: Save history and dashboard
        run: |
          git config user.name "market-heat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Index update $(date -u +%F)"
          git push

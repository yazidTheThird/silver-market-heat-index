name: Store probe (one-off)
on:
  push:
    branches: [store-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas beautifulsoup4 pyyaml
      - run: python probe/probe3.py
      - run: |
          git config user.name "market-heat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe/results3.json
          git commit -m "Probe results [skip ci]"
          git push

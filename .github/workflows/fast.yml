name: Fast launch check

# Every 3 hours: re-checks new colorized launches so sell-outs are timed to within a
# few hours instead of a day. Feeds (Shopify/WooCommerce) are read in full; other
# stores only fetch new and recent products. No index, no Telegram.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-heat-data
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install headless browser (only if a store uses render true)
        run: |
          if grep -Eq '^\s*render:\s*true' config.yaml; then
            python -m playwright install --with-deps chromium
          fi

      - name: Check recent launches
        run: python run.py --fast

      - name: Save
        run: |
          git config user.name "market-heat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Fast check $(date -u +'%F %H:%M')"
          git pull --rebase -q || true
          git push
